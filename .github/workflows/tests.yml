name: Проверки MVP (без Codex и сети)

on:
  push:
    branches:
      - main
      - issue/3-supervisor-mvp
  pull_request:

permissions:
  contents: read

jobs:
  offline-unit:
    name: Офлайн-тесты / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Получить код
        uses: actions/checkout@v4
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Проверить синтаксис
        run: python -m compileall -q supervisor launcher tools tests
      - name: Запустить unit-тесты (только mock)
        run: python -m unittest discover -s tests -v
